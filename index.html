<script type="text/babel">
    const { useState } = React;

    const STAGES = [
        { id: 'kinetic', name: 'kinetic FIELD', color: 'text-yellow-400 border-yellow-400' },
        { id: 'circuit', name: 'circuit GROUNDS', color: 'text-teal-400 border-teal-400' },
        { id: 'stereo', name: 'stereo BLOOM', color: 'text-pink-400 border-pink-400' },
        { id: 'bionic', name: 'bionic JUNGLE', color: 'text-green-400 border-green-400' },
        { id: 'boombox', name: 'boombox ART CAR', color: 'text-purple-400 border-purple-400' },
    ];

    const TIMETABLE_DATA = [
        {
            time: '17:00',
            artists: {
                kinetic: { name: 'HOHO ONE', time: '17:00-18:00', img: 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=150' },
                circuit: { name: 'ASHIKO', time: '17:00-18:15', img: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150' },
                stereo: { name: 'AUREDE', time: '17:00-18:00', img: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150' },
                bionic: { name: 'ONE1', time: '17:00-18:15', img: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150' },
                boombox: { name: 'HONGTON_E', time: '17:00-18:15', img: 'https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=150' },
            }
        },
        {
            time: '18:00',
            artists: {
                kinetic: { name: 'SUNGYOO', time: '18:00-19:00', img: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150' },
                circuit: { name: 'CHEEZ & YUKA', time: '18:15-19:15', img: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150' },
                stereo: { name: 'SSOMBO', time: '18:00-19:00', img: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=150' },
                bionic: { name: 'DAVICO B3B', time: '18:15-19:30', img: 'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150' },
                boombox: { name: 'MONSTER', time: '18:15-19:30', img: 'https://images.unsplash.com/photo-1501196354995-cbb51c65aaea?w=150' },
            }
        },
        {
            time: '20:00',
            artists: {
                kinetic: { name: 'MUZIE', time: '20:00-21:00', img: 'https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=150' },
                circuit: { name: 'WAY2_X', time: '20:15-21:15', img: 'https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=150' },
                stereo: { name: 'BASSKRAP', time: '20:00-21:00', img: 'https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?w=150' },
                bionic: { name: 'YUUKI Y.', time: '19:30-20:45', img: 'https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=150' },
                boombox: { name: 'LOCO SOOUND', time: '19:30-20:45', img: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=150' },
            }
        },
        {
            time: '22:00',
            artists: {
                kinetic: { name: 'R3HAB', time: '22:00-23:07', img: 'https://images.unsplash.com/photo-1513956589380-bad6acb9b9d4?w=150' },
                circuit: { name: 'ALLEYCVT', time: '22:15-23:15', img: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=150' },
                stereo: { name: 'DØMINA', time: '21:00-22:00', img: 'https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=150' },
                bionic: { name: '33 BELOW', time: '22:00-23:15', img: 'https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?w=150' },
                boombox: { name: 'SPACE COWBOY', time: '22:00-23:15', img: 'https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=150' },
            }
        },
        {
            time: '01:00',
            artists: {
                kinetic: { name: 'DJ SNAKE', time: '01:45-03:00', img: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150' },
                circuit: { name: 'SARA LANDRY', time: '01:30-03:00', img: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150' },
                stereo: { name: 'COONE', time: '01:45-03:00', img: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150' },
                bionic: { name: 'WAX MOTIF', time: '01:45-03:00', img: 'https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=150' },
                boombox: { name: 'SIM + PINO', time: '01:45-03:00', img: 'https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=150' },
            }
        }
    ];

    function App() {
        const [selectedArtists, setSelectedArtists] = useState([]);

        const toggleArtist = (artistName) => {
            if (selectedArtists.includes(artistName)) {
                setSelectedArtists(selectedArtists.filter(item => item !== artistName));
            } else {
                setSelectedArtists([...selectedArtists, artistName]);
            }
        };

        return (
            <div className="min-h-screen bg-[#07030f] text-white flex flex-col items-center py-6 px-2">
                <header className="text-center mb-6">
                    <h1 className="text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-pink-400 to-purple-500">
                        EDC KOREA 2026
                    </h1>
                    <p className="text-xs text-gray-300 mt-1 tracking-widest font-semibold">
                        SATURDAY • OCT 3
                    </p>
                    <div className="mt-2 inline-block bg-purple-900/60 border border-purple-500/50 px-3 py-1 rounded-full text-xs font-medium text-pink-300">
                        MY LINEUP • {selectedArtists.length} ARTISTS
                    </div>
                </header>

                <div className="w-full max-w-4xl overflow-x-auto bg-[#0b0617]/90 rounded-2xl p-3 border border-purple-900/40 shadow-2xl">
                    <div className="min-w-[700px]">
                        <div className="grid grid-cols-6 gap-2 mb-3 text-center border-b border-gray-800 pb-2">
                            <div className="text-xs font-bold text-gray-500 flex items-center justify-center">TIME</div>
                            {STAGES.map(stage => (
                                <div key={stage.id} className={`text-xs font-extrabold tracking-wider uppercase border-b-2 pb-1 ${stage.color}`}>
                                    {stage.name}
                                </div>
                            ))}
                        </div>

                        <div className="space-y-3">
                            {TIMETABLE_DATA.map((row, idx) => (
                                <div key={idx} className="grid grid-cols-6 gap-2 items-stretch">
                                    <div className="text-xs font-bold text-gray-400 flex items-center justify-center">
                                        {row.time}
                                    </div>

                                    {STAGES.map(stage => {
                                        const artist = row.artists[stage.id];
                                        if (!artist) return <div key={stage.id} className="bg-gray-900/20 rounded-lg"></div>;
                                        
                                        const isSelected = selectedArtists.includes(artist.name);

                                        return (
                                            <div
                                                key={stage.id}
                                                onClick={() => toggleArtist(artist.name)}
                                                className={`relative rounded-xl overflow-hidden cursor-pointer transition-all duration-200 flex flex-col justify-end p-2 h-28 bg-cover bg-center border ${
                                                    isSelected 
                                                        ? 'border-yellow-400 ring-2 ring-yellow-400/50 scale-[1.02]' 
                                                        : 'border-transparent hover:border-gray-500 opacity-80 hover:opacity-100'
                                                }`}
                                                style={{ backgroundImage: `linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.2)), url(${artist.img})` }}
                                            >
                                                {isSelected && (
                                                    <div className="absolute top-1.5 right-1.5 bg-yellow-400 text-black rounded-full p-0.5 w-4 h-4 flex items-center justify-center font-bold text-[10px]">
                                                        ✓
                                                    </div>
                                                )}
                                                <span className="text-[10px] text-yellow-300 font-semibold">{artist.time}</span>
                                                <span className="text-xs font-bold leading-tight truncate">{artist.name}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>

                <footer className="mt-6 text-center text-xs text-gray-500">
                    <p>아티스트를 터치하여 나만의 라인업을 만들어보세요!</p>
                </footer>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
